name: check

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Syntax
        run: |
          bash -n setup home/.local/bin/impasto
          python3 -m py_compile home/.local/bin/impasto-theme home/.config/quickshell/scripts/*.py
          for f in home/.local/share/impasto/themes/*/colors.toml; do python3 -c "import tomllib,sys; tomllib.load(open(sys.argv[1],'rb'))" "$f"; done
