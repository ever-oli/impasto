name: check

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Syntax
        run: |
          bash -n setup packages/tools/bin/notch
          python3 -m py_compile packages/*/scripts/*.py
          for f in packages/data/notch/themes/*/colors.toml; do python3 -c "import tomllib,sys; tomllib.load(open(sys.argv[1],'rb'))" "$f"; done
          node --check packages/media/bin/notch-resolve.mjs
      - name: The size ratchet
        run: sh tests/size-ratchet.sh
      - name: The install, into a home of its own
        run: sh tests/setup.sh
      - name: Lint
        run: |
          pip install --quiet pyflakes
          python3 -m pyflakes packages/*/scripts/*.py
      - name: The bugs that were found
        run: sh tests/regressions.sh
      - name: The mistakes that keep happening
        # correct.sh needs no shell: it reads the tree and the docs. The
        # gates that need a live shell cannot run here, and the ci said so
        # by not running them, which is how a red gate looked green.
        run: sh tests/correct.sh
