# mpv on a Wayland desktop.
#
# Left to itself mpv picks the gpu output, which on this machine opens an
# X11 surface that does not exist, and mpv dies before the first frame
# (vo_x11_init assertion). The wayland output is the one that works here,
# and it needs its own context too: without it the window never opens and
# the stream plays to nothing.
vo=wayland
gpu-context=wayland

# Keep the window open at the end of a stream, so the notch can show it.
keep-open=yes
