<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- notch lean-niri: AnnotationMono Nerd Font is the default for monospace
     and sans (and serif), with Noto kept behind it for emoji and CJK. -->
<fontconfig>
  <alias binding="strong">
    <family>monospace</family>
    <prefer>
      <family>AnnotationM Nerd Font Mono</family>
      <family>Noto Color Emoji</family>
      <family>Noto Sans CJK JP</family>
      <family>Noto Sans Mono</family>
    </prefer>
  </alias>
  <alias binding="strong">
    <family>sans-serif</family>
    <prefer>
      <family>AnnotationM Nerd Font</family>
      <family>Noto Color Emoji</family>
      <family>Noto Sans CJK JP</family>
      <family>Noto Sans</family>
    </prefer>
  </alias>
  <alias binding="strong">
    <family>serif</family>
    <prefer>
      <family>AnnotationM Nerd Font</family>
      <family>Noto Color Emoji</family>
      <family>Noto Serif CJK JP</family>
      <family>Noto Serif</family>
    </prefer>
  </alias>
  <alias binding="strong">
    <family>system-ui</family>
    <prefer><family>AnnotationM Nerd Font</family></prefer>
  </alias>
  <alias binding="strong">
    <family>emoji</family>
    <prefer><family>Noto Color Emoji</family></prefer>
  </alias>
</fontconfig>
