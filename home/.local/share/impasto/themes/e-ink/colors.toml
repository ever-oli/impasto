# E-Ink Gold — e-ink.nvim grayscale palette on warm gold paper (light)
# Source: https://github.com/e-ink-colorscheme/e-ink.nvim
# Ink-grey ramp over an aged-gold paper hue — one hue allowed to lead.

mode = "light"

accent = "#896A25"        # aged gold ink — the only hue allowed to lead
selection = "#CFC7AE"
selection_foreground = "#3A362B"
selection_background = "#CFC7AE"
muted = "#786E58"

background = "#F9F6EC"    # gold paper
dark_background = "#E9E4D3"
darker_background = "#DFD9C5"
lighter_background = "#FDFCF4"

foreground = "#3A362B"    # warm graphite ink
dark_foreground = "#645F52"
light_foreground = "#504A3C"
bright_foreground = "#242012"

red = "#C24640"           # ember hints, muted to sit in the paper ramp
yellow = "#8D692D"        # gold mid — dry ink smear
orange = "#C9743F"
green = "#836F23"         # everforest green retired to the gold family
cyan = "#7B7148"          # khaki in place of teal
blue = "#7F6C51"          # tan in place of slate
magenta = "#B94675"
brown = "#96755C"

bright_red = "#CA3C36"
bright_yellow = "#916828"
bright_green = "#806F31"
bright_cyan = "#797149"
bright_blue = "#856D4E"
bright_magenta = "#C13F74"

color0 = "#F9F6EC"
color1 = "#C24640"
color2 = "#836F23"
color3 = "#8D692D"
color4 = "#7F6C51"
color5 = "#B94675"
color6 = "#7B7148"
color7 = "#3A362B"
