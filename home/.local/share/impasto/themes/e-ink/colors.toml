# E-Ink Gold — e-ink.nvim grayscale palette on warm gold paper (light)
# Source: https://github.com/e-ink-colorscheme/e-ink.nvim
# Ink-grey ramp over an aged-gold paper hue — one hue allowed to lead.

mode = "light"

accent = "#A9832E"        # aged gold ink — the only hue allowed to lead
selection = "#CFC7AE"
selection_foreground = "#3A362B"
selection_background = "#CFC7AE"
muted = "#A39A82"

background = "#F9F6EC"    # gold paper
dark_background = "#E9E4D3"
darker_background = "#DFD9C5"
lighter_background = "#FDFCF4"

foreground = "#3A362B"    # warm graphite ink
dark_foreground = "#645F52"
light_foreground = "#504A3C"
bright_foreground = "#242012"

red = "#C75A54"           # ember hints, muted to sit in the paper ramp
yellow = "#C79A4E"        # gold mid — dry ink smear
orange = "#C9743F"
green = "#B3932F"         # everforest green retired to the gold family
cyan = "#998F5C"          # khaki in place of teal
blue = "#9C8A66"          # tan in place of slate
magenta = "#C36E93"
brown = "#96755C"

bright_red = "#D8746E"
bright_yellow = "#D9B276"
bright_green = "#C7AF62"
bright_cyan = "#A9A173"
bright_blue = "#B09878"
bright_magenta = "#D48BAD"

color0 = "#F9F6EC"
color1 = "#C75A54"
color2 = "#B3932F"
color3 = "#C79A4E"
color4 = "#9C8A66"
color5 = "#C36E93"
color6 = "#998F5C"
color7 = "#3A362B"
color8 = "#504A3C"
color9 = "#D8746E"
color10 = "#C7AF62"
color11 = "#D9B276"
color12 = "#B09878"
color13 = "#D48BAD"
color14 = "#A9A173"
color15 = "#242012"
