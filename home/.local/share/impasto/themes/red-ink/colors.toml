# Red Ink — "e-ink, but the ink is red"
# Paper: parchment from omarchy-venice-from-above (mattbbia)
# Ink:   the red of omarchy-roseofdune-theme (HANCORE-linux), #A02B16
# Structure: e-ink.nvim — one hue, all others in its family.

mode = "light"

accent = "#A02B16"         # the red ink
selection = "#D29FA7"      # roseofdune's dusted-rose selection
selection_foreground = "#7C1B0B"
selection_background = "#D29FA7"
muted = "#7F6A5E"

background = "#F5F2E9"     # Venice parchment
dark_background = "#EBE4D7"
darker_background = "#E2D6C4"
lighter_background = "#FBF8F0"

foreground = "#A02B16"     # red ink instead of black
dark_foreground = "#8A2312"
light_foreground = "#B54E2E"
bright_foreground = "#7C1B0B"

red = "#B62F14"
yellow = "#906622"         # ochre — dry ink smear
orange = "#C25424"         # vermilion
green = "#9E4F5B"          # roseofdune's rose "green"
cyan = "#A34D63"           # faded rose-cyan
blue = "#8A4A3E"           # wine, standing in for blue
magenta = "#78292E"        # deep wine (roseofdune magenta)
