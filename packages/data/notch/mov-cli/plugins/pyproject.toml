[project]
name = "mov-cli-youtube"
version = "1.3.11"
description = "A mov-cli v4 plugin for watching youtube, patched by the notch."
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = ["mov-cli", "yt-dlp", "pytube"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["mov_cli_youtube"]
