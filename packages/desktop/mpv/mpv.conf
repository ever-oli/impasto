# mpv on this machine.
#
# The wayland output wants an EGL context, and EGL is broken here (the
# compositor runs on software GL), so mpv opened no window and played the
# audio only. The x11 output through XWayland works, but only with a
# software GL: mpv's own launcher (ani-cli) does not set that, so the
# notch sets LIBGL_ALWAYS_SOFTWARE=1 in the terminal it hands the player.
vo=x11

# Keep the window up at the end of a stream.
keep-open=yes
